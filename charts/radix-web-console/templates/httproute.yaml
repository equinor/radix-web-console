{{- if .Values.httproute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "radix-web-console.fullname" . }}
  labels:
    {{- include "radix-web-console.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httproute.parentRefs | nindent 4 }}
  hostnames:
    {{- if .Values.httproute.hostnames }}
    {{- toYaml .Values.httproute.hostnames | nindent 4 }}
    {{- else }}
    {{- required "httproute.hostnames is required." .Values.httproute.hostnames -}}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.httproute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "radix-web-console.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
