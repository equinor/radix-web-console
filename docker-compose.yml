services:
  web:
    image: docker.io/node:24.19.0-alpine3.24
    container_name: radix-web_container
    read_only: true
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "npm install --prefer-offline --no-audit --ignore-scripts && chown -R node:node node_modules && npm run dev",
      ]
    environment:
      - npm_config_proxy=${NPM_PROXY}
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: node-modules
        target: /app/node_modules
      - type: volume
        target: /root
        tmpfs: {}
    networks:
      - radix
    ports:
      - "3000:3000"
      - "9222:9222"

  proxy:
    image: docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine3.24
    container_name: radix-proxy_container
    read_only: true
    volumes:
      - type: bind
        source: ./proxy/server.dev.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./src/inject-env-template.js
        target: /usr/share/nginx/html/inject-env.js
        read_only: true
      - type: volume
        target: /tmp
        tmpfs: {}
    networks:
      - radix
    ports:
      - "8080:8080"

volumes:
  node-modules:
    name: radix-web_node-modules

networks:
  radix:
    name: radix
